<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeo — Trend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Trend — verde (primária) + creme (secundária) */
      --bg:            #45923A;   /* verde — cor primária */
      --dark:          #FFFFFF;   /* texto */
      --border:        rgba(255,255,255,0.26);
      --border-strong: rgba(255,255,255,0.55);
      --accent:        #E8E4D5;   /* creme — cor secundária */
      --accent-ink:    #1F4A1A;
      --video-bg:      #14230F;   /* palco do vídeo */
      --font-serif:    'Montserrat', system-ui, sans-serif;
      --font-sans:     'Montserrat', system-ui, sans-serif;
      --ease:          cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* bg.svg: verde com o monograma "T" a 10 %, que entra uma vez e fica */
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg) url('assets/brand/bg.svg') center / cover no-repeat;
      color: var(--dark);
      font-family: var(--font-sans);
    }

    #vg-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: transparent;
      position: relative;
      z-index: 2;
    }

    /* ── HEADER ── */
    #vg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px 10px 36px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }
    /* Só o logo no cabeçalho — o `align-items: center` do #vg-header já o
       centraliza na faixa. */
    #vg-brand { display: flex; align-items: center; }
    /* logo empilhado; a escrita roda uma vez (com prefers-reduced-motion o
       próprio SVG mostra direto o quadro final) */
    #vg-logo { height: clamp(64px, 6.4vw, 92px); width: auto; display: block; }

    #btn-close {
      width: 38px; height: 38px;
      border: 1px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: var(--dark);
      transition: background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease);
      flex-shrink: 0;
    }
    #btn-close:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    /* ── STAGE ── */
    #vg-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--video-bg);
      padding: 20px;
    }
    /* A caixa do <video> tem de ter a MESMA proporção do arquivo (1920 × 816, já sem as tarjas pretas — ver build_assets.ps1).
       Com width/height 100% o elemento ocupava o palco inteiro e o filme ficava
       letterboxed dentro dele — e os controles nativos, que se desenham na borda
       do ELEMENTO e não na da imagem, ficavam mais largos que o vídeo e soltos
       embaixo. Com `aspect-ratio` + `max-*: 100%` a caixa encolhe até caber na
       proporção certa, e a barra de controles encosta exatamente no filme. */
    #vg-player {
      aspect-ratio: 1920 / 816;
      width: auto;
      height: auto;
      max-width: min(100%, 1600px);
      max-height: 100%;
      display: block;
      outline: none;
      border-radius: 4px;
      background: #000;
    }

    /* Controles nativos: remove o degradê/scrim escuro que surgia atrás da barra
       ao passar o mouse (dava sensação de moldura/corte ao redor do vídeo).
       Mantém apenas os botões/scrubber, sem a sombra em gradiente. */
    #vg-player::-webkit-media-controls-enclosure { background: transparent; }
    #vg-player::-webkit-media-controls-panel {
      background: transparent;
      background-image: none;
      box-shadow: none;
    }

    #vg-foot {
      flex-shrink: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.06em;
      opacity: 0.4;
      padding: 8px 16px 12px;
    }

    @media (max-width: 600px) {
      #vg-header { padding: 8px 14px; }
      #vg-logo { height: 56px; }
      #vg-stage { padding: 0; }
    }

    /* toque: alvo confortável para fechar e rótulo legível */
    @media (max-width: 900px) {
      #btn-close { width: 44px; height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

<div id="vg-root">
  <header id="vg-header">
    <div id="vg-brand">
      <img id="vg-logo" src="assets/brand/logo.svg" alt="Trend">
    </div>
    <button id="btn-close" title="Fechar" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </header>

  <div id="vg-stage">
    <video id="vg-player"
           src="assets/video/video-trend.mp4"
           autoplay playsinline controls
           preload="auto">
    </video>
  </div>

  <p id="vg-foot">Imagens meramente ilustrativas.</p>
</div>

<script>
  var player = document.getElementById('vg-player');

  // tenta autoplay com som; se o browser bloquear, cai para mudo
  player.play().catch(function () {
    player.muted = true;
    player.play().catch(function () {});
  });

  document.getElementById('btn-close').addEventListener('click', closeGallery);

  function closeGallery() {
    try { player.pause(); } catch (e) {}
    if (window.parent !== window) {
      window.parent.postMessage({ action: 'closeGallery' }, '*');
    } else if (window.history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  }
</script>
</body>
</html>
